<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Session Booking</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body{font-family:'Poppins',sans-serif;background:#fff3e0;margin:0;padding-top:90px;text-align:center;}
.menu{position:fixed;top:0;left:0;width:100%;height:60px;background:#111;display:flex;align-items:center;justify-content:center;gap:40px;z-index:1000;}
.menu a{color:white;text-decoration:none;font-size:16px;font-weight:500;}
.menu a:hover{color:#ff9800;}
.back-btn{position:fixed;top:15px;right:20px;padding:10px 16px;border:none;background:white;border-radius:8px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,0.2);}
h1{margin-bottom:15px;color:#e65100;}
.subtitle{color:#8d6e63;margin-bottom:25px;}
.container{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:25px;max-width:900px;margin:auto;}
.card{background:white;padding:25px 15px;border-radius:12px;color:#333;transition:0.3s;box-shadow:0 4px 10px rgba(0,0,0,0.08);border:1px solid #ffe0b2;}
.card:hover{transform:translateY(-5px);box-shadow:0 8px 18px rgba(0,0,0,0.15);}
.icon{display:flex;justify-content:center;margin-bottom:12px;}
.icon i{font-size:36px;color:#ff9800;background:#fff3e0;padding:15px;border-radius:50%;}
.level{font-size:22px;font-weight:600;}
.language{font-size:14px;font-weight:500;color:#8d6e63;margin-bottom:4px;}
.desc{font-size:14px;color:#666;}
.price{margin-top:10px;font-weight:bold;color:#e65100;}
.join-btn{margin-top:14px;padding:8px 14px;border:none;background:#ff9800;color:white;border-radius:8px;cursor:pointer;font-weight:500;transition:0.3s;}
.join-btn:hover{background:#f57c00;transform:scale(1.05);}
.join-btn:disabled{background:#ccc;cursor:not-allowed;}

/* Payment Modal */
.modal-bg{
  position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:2000;
}
.modal{
  background:white;padding:25px 20px;border-radius:12px;width:300px;box-shadow:0 6px 20px rgba(0,0,0,0.3);text-align:left;position:relative;
}
.modal h2{margin-top:0;color:#e65100;text-align:center;}
.modal input{width:100%;padding:8px 10px;margin:8px 0;border:1px solid #ccc;border-radius:6px;}
.modal button{width:100%;padding:10px;background:#ff9800;color:white;border:none;border-radius:8px;font-weight:500;cursor:pointer;transition:0.3s;}
.modal button:hover{background:#f57c00;}
.close-btn{position:absolute;top:0px;right:0px;background:#ccc;color:white;border:none;border-radius:50%;width:24px;height:24px;cursor:pointer;font-weight:bold;}
</style>
</head>
<body>

<button class="back-btn" onclick="window.location.href='levels.html'">🏠 Back</button>
<div class="menu">
<a href="levels.html">Home</a>
<a href="booking.html">Book Table</a>
<a href="friends.html">Friends</a>
<a href="private.html">Private Sessions</a>
</div>

<h1>Private Session Booking</h1>
<p class="subtitle">Each session allows only 1 participant</p>

<div class="container" id="container"></div>

<!-- Payment Modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <button class="close-btn" id="closeModal">×</button>
    <h2>Payment Details</h2>
    <p id="sessionInfo"></p>
    <input type="text" id="cardName" placeholder="Cardholder Name">
    <input type="text" id="cardNumber" placeholder="Card Number (16 digits)" maxlength="16" oninput="this.value=this.value.replace(/\D/g,'').slice(0,16)">
    <input type="text" id="expiry" placeholder="MM/YY">
    <input type="text" id="cvv" placeholder="CVV (3-6 digits)" maxlength="6" oninput="this.value=this.value.replace(/\D/g,'').slice(0,6)">
    <button id="payBtn">Pay Now</button>
  </div>
</div>

<script>
const allLanguages=["Marathi","Sanskrit","English","Spanish","French","Japanese"];
const sessions=[
{level:"A1",topic:"Private Beginner Session",icon:"fa-leaf",price:100,host:"Anjali",rating:4.8,seats:{}},
{level:"A2",topic:"Private Elementary Session",icon:"fa-book-open",price:200,host:"Pierre",rating:4.7,seats:{}},
{level:"B1",topic:"Private Intermediate Session",icon:"fa-comment-dots",price:300,host:"Maria",rating:4.9,seats:{}},
{level:"B2",topic:"Private Upper Intermediate",icon:"fa-language",price:400,host:"James",rating:4.9,seats:{}},
{level:"C1",topic:"Private Advanced Session",icon:"fa-chalkboard-user",price:500,host:"Rishi",rating:5.0,seats:{}},
{level:"C2",topic:"Private Fluent Session",icon:"fa-medal",price:600,host:"Yuki",rating:4.8,seats:{}}
];

const container=document.getElementById("container");
const modalBg=document.getElementById("modalBg");
const closeModal=document.getElementById("closeModal");
const sessionInfo=document.getElementById("sessionInfo");
const payBtn=document.getElementById("payBtn");
const expiryInput=document.getElementById("expiry");

let currentSession=null;
let currentLang="";

// Auto-add slash after month
expiryInput.addEventListener("input", (e) => {
  let value = e.target.value.replace(/\D/g, "");
  if(value.length>4) value = value.slice(0,4); 
  if(value.length>2) value = value.slice(0,2) + "/" + value.slice(2);
  e.target.value = value;
});

function seatIcon(level, lang){
  const s = sessions.find(s=>s.level===level);
  if(s.seats[lang]===1){
    return s.status && s.status[lang]==="waiting" ? "⏳ Waiting for host" : "🟢 Booked";
  }
  return "⚪";
}

function renderSessions(){
  container.innerHTML="";
  const urlParams=new URLSearchParams(window.location.search);
  const currentFilter=urlParams.get('level') || "";

  sessions.forEach(s=>{
    if(currentFilter && s.level!==currentFilter) return;
    allLanguages.forEach(lang=>{
      const card=document.createElement("div");
      card.className="card";
      card.innerHTML=`
        <div class="icon"><i class="fa-solid ${s.icon}"></i></div>
        <div class="level">${s.level}</div>
        <div class="language">Language: ${lang}</div>
        <div class="desc">${s.topic}</div>
        <div class="price">₹${s.price}</div>
        <p class="host">Host: ${s.host} ⭐${s.rating}</p>
        <div class="seats">Seat: ${seatIcon(s.level, lang)}</div>
        <button class="join-btn" ${s.seats[lang]===1?"disabled":""}>Pay & Join</button>
      `;
      const btn=card.querySelector(".join-btn");
      btn.addEventListener("click", ()=>{
        if(s.seats[lang]!==1){
          currentSession=s;
          currentLang=lang;
          sessionInfo.textContent=`${s.topic} (${lang}) - ₹${s.price}`;
          modalBg.style.display="flex";
        }
      });
      container.appendChild(card);
    });
  });
}

renderSessions();

closeModal.onclick=()=>{ modalBg.style.display="none"; };

payBtn.onclick=()=>{
  const name=document.getElementById("cardName").value.trim();
  const number=document.getElementById("cardNumber").value.trim();
  const expiry=document.getElementById("expiry").value.trim();
  const cvv=document.getElementById("cvv").value.trim();

  if(!name || !number || !expiry || !cvv){
    alert("Please fill all payment details.");
    return;
  }

  if(!/^\d{16}$/.test(number)){
    alert("Card number must be exactly 16 digits.");
    return;
  }

  const expMatch = expiry.match(/^(\d{2})\/(\d{2})$/);
  if(!expMatch){
    alert("Expiry must be in MM/YY format.");
    return;
  }

  const month = parseInt(expMatch[1],10);
  const year = parseInt(expMatch[2],10)+2000;
  const now = new Date();
  const currentYear = now.getFullYear();
  const currentMonth = now.getMonth()+1;

  if(month<1 || month>12){
    alert("Expiry month must be between 01 and 12.");
    return;
  }

  if(year !== currentYear){
    alert("Expiry year must be the current year.");
    return;
  }
  if(month < currentMonth){
    alert("Expiry month cannot be in the past.");
    return;
  }

  if(!/^\d{3,6}$/.test(cvv)){
    alert("CVV must be 3 to 6 digits.");
    return;
  }

  // Mark as booked and waiting
  currentSession.seats[currentLang]=1;
  if(!currentSession.status) currentSession.status={};
  currentSession.status[currentLang]="waiting";

  alert(`Payment successful! You booked ${currentSession.topic} (${currentLang}). Waiting for host to connect.`);

  modalBg.style.display="none";

  document.getElementById("cardName").value="";
  document.getElementById("cardNumber").value="";
  document.getElementById("expiry").value="";
  document.getElementById("cvv").value="";

  renderSessions();
};
</script>

</body>
</html>
